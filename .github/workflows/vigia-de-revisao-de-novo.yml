name: vigia-de-revisao-de-novo

# Roda de novo o check `vigia-de-revisao` quando alguém comenta `/vigia` no PR,
# e responde no próprio comentário com uma reação (issue #55).
#
# Existe porque RESOLVER UMA CONVERSA DE REVISÃO NÃO DISPARA WORKFLOW NENHUM: o
# Actions não tem evento de conversa resolvida. Sem este atalho, o check ficaria
# vermelho depois de tudo resolvido até o próximo push.
#
# A regra mora em scripts/vigia-de-novo.mjs, vigiado por
# tests/unit/vigia-de-novo.test.ts: o comando no começo do comentário (inclusive
# a forma `C:/…/vigia` que o Git Bash do Windows produz a partir de `/vigia`), a
# nova execução no commit do PR, e a reação 🚀 / 👀 / 😕. O `if:` abaixo é só o
# filtro barato e de segurança, antes de qualquer checkout; quem decide se é o
# comando é o script.
#
# O checkout é da branch padrão (é o que `issue_comment` entrega), esparso, só do
# script: nenhum código do PR roda aqui, e o texto do comentário nunca é
# interpolado num comando.
on:
  issue_comment:
    types: [created]

# `actions: write` pede a nova execução; `pull-requests: write` lê o commit do PR
# e põe a reação no comentário; `contents: read` faz o checkout do script.
permissions:
  actions: write
  contents: read
  pull-requests: write

jobs:
  de-novo:
    # Só em PR, só com "vigia" no texto, e só de quem tem escrita no repositório.
    # Pulado aqui é o esperado para todo outro comentário: este job não é check.
    if: github.event.issue.pull_request && contains(github.event.comment.body, 'vigia') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Fixado por SHA (v7.0.1), como em vigia-de-revisao.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: scripts/vigia-de-novo.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Rodar de novo o vigia no commit atual do PR
        run: node scripts/vigia-de-novo.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
